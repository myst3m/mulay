# stat-models の設定。実行時に key=value (mulay run . stat.serve=embed) か -D で上書きできる。
http:
  port: "8081"

# どの口を出すか: embed (embed.hash512.stat)、llm (llm.tfidf.stat)、both (両方。手元の試験用)
stat:
  serve: "both"
  # 統計的な LLM (stat/agent.dwl) の、例文との TF-IDF のしきい値と、どれにも当たらないときの答え (agent-harness と同じ値)
  threshold: "0.3"
  noAnswer: "Sorry, I could not find an answer."
  # 埋め込みの次元 (stat/text.dwl の DIMS と同じ。dimensions はこれと同じときだけ受ける)
  dims: "512"
