syntax = "proto3";

package t;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";

enum Color {
  option allow_alias = true;
  RED = 0;
  GREEN = 1;
  BLUE = 2;
  AZURE = 2;
}

message Scalars {
  double d = 1;
  float f = 2;
  int32 i32 = 3;
  int64 i64 = 4;
  uint32 u32 = 5;
  uint64 u64 = 6;
  sint32 s32 = 7;
  sint64 s64 = 8;
  fixed32 f32 = 9;
  fixed64 f64 = 10;
  sfixed32 sf32 = 11;
  sfixed64 sf64 = 12;
  bool b = 13;
  string s = 14;
  bytes by = 15;
}

message Inner {
  string name = 1;
  int32 v = 2;
}

message Outer {
  Inner inner = 1;
  repeated Inner items = 2;
  repeated int32 nums = 3;
  repeated int32 unpacked = 4 [packed = false];
  repeated string strs = 5;
  map<string, int32> counts = 6;
  map<int32, Inner> by_id = 7;
  Color color = 8;
  repeated Color colors = 9;
  oneof choice {
    string text = 10;
    int32 number = 11;
    Inner obj = 12;
  }
  optional int32 maybe = 13;
  repeated double ds = 14;
  repeated bool bs = 15;
}

message Wkt {
  google.protobuf.Timestamp ts = 1;
  google.protobuf.Duration dur = 2;
  google.protobuf.StringValue sv = 3;
  google.protobuf.Int32Value iv = 4;
  google.protobuf.BoolValue bv = 5;
  google.protobuf.Struct st = 6;
  google.protobuf.Value val = 7;
  google.protobuf.ListValue lv = 8;
  google.protobuf.Empty em = 9;
  google.protobuf.Any any = 10;
  google.protobuf.FieldMask fm = 11;
  google.protobuf.BytesValue byv = 12;
  google.protobuf.DoubleValue dv = 13;
  google.protobuf.Int64Value i64v = 14;
  google.protobuf.UInt64Value u64v = 15;
  google.protobuf.FloatValue fv = 16;
  google.protobuf.UInt32Value u32v = 17;
  google.protobuf.NullValue nv = 18;
}

message Tree {
  string name = 1;
  repeated Tree children = 2;
}

message Camel {
  string first_name = 1;
  int32 lastValue = 2;
}
