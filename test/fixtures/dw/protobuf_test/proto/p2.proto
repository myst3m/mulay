syntax = "proto2";

package t2;

message P2 {
  enum E {
    A = 1;
    B = 2;
  }
  required string name = 1;
  optional int32 n = 2 [default = 7];
  repeated int32 xs = 3;
  optional E e = 4 [default = B];
  repeated int32 packed_xs = 5 [packed = true];
  optional string s = 6 [default = "dflt"];
}
