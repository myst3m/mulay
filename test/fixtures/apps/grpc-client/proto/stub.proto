syntax = "proto3";
package stub;

message Req {
  string name = 1;
  int32 count = 2;
  repeated string tags = 3;
}

message Rep {
  string message = 1;
  int32 n = 2;
  repeated string tags = 3;
}

// 振る舞いは tools/mule-oracle の GrpcServer (%%% grpcserver) が決める
service S {
  rpc Echo (Req) returns (Rep);
  rpc Headers (Req) returns (Rep);
  rpc Fail (Req) returns (Rep);
  rpc TrailersOnly (Req) returns (Rep);
  rpc Garbage (Req) returns (Rep);
  rpc BadProto (Req) returns (Rep);
  rpc Http503 (Req) returns (Rep);
  rpc NoStatus (Req) returns (Rep);
  rpc Empty (Req) returns (Rep);
  rpc Two (Req) returns (Rep);
  rpc Nope (Req) returns (Rep);
  rpc Bare (Req) returns (Rep);
  rpc Odd (Req) returns (Rep);
}
