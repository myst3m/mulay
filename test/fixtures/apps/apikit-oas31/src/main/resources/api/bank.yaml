openapi: 3.1.0
info:
  title: Bank API
  version: 1.0.0
servers:
  - url: http://localhost:18586/api/v1
paths:
  /deposits:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/DepositRequest.json"
      responses:
        "201":
          description: ok
  /transfers:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: object
                  properties:
                    accountNumber:
                      type: string
                      pattern: "^[0-9]{7}$"
                    bulkTransferFunds:
                      type: boolean
                  anyOf:
                    - required: [accountNumber]
                    - required: [bulkTransferFunds]
                      properties:
                        bulkTransferFunds:
                          enum: [true]
              required: [source]
      responses:
        "201":
          description: ok
  /probes:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reqOnly:
                  type: object
                  required: [x]
                ownProps:
                  type: object
                  anyOf:
                    - required: [p]
                      properties:
                        p: {type: string}
                    - required: [q]
                      properties:
                        q: {type: boolean}
                oneOnly:
                  type: object
                  properties:
                    m: {type: string}
                  oneOf:
                    - required: [m]
                    - required: [n]
      responses:
        "201":
          description: ok
  /dates:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                d:
                  type: string
                  format: date
                dt:
                  type: string
                  format: date-time
                dn:
                  type: [string, "null"]
                  format: date
      responses:
        "201":
          description: ok
  /channels:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  enum: [Atm]
                note:
                  type: [string, "null"]
                count:
                  type: integer
                  minimum: 0
                a:
                  type: [integer, string]
                b:
                  type: [boolean, "null", integer]
                c:
                  type: ["null", string]
              required: [channel]
      responses:
        "201":
          description: ok
