openapi: 3.0.3
info:
  title: Shop API
  version: 1.0.0
servers:
  - url: http://localhost:18131/api/v1
paths:
  /probes:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: object
                  properties:
                    accountNumber:
                      type: string
                    bulkTransferFunds:
                      type: boolean
                  anyOf:
                    - required: [accountNumber]
                    - required: [bulkTransferFunds]
                      properties:
                        bulkTransferFunds:
                          enum: [true]
                reqOnly:
                  type: object
                  required: [x]
                oneOnly:
                  type: object
                  oneOf:
                    - required: [m]
                    - required: [n]
      responses:
        "201":
          description: ok
  /items:
    get:
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: sort
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: active
          in: query
          schema:
            type: boolean
        - name: tag
          in: query
          schema:
            type: array
            items:
              type: string
        - name: X-Tenant
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
          application/xml:
            schema:
              type: object
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
    put:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 5
                price:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                code:
                  type: string
                  pattern: '^[A-Z]{3}$'
                email:
                  type: string
                  format: email
                kind:
                  oneOf:
                    - type: string
                    - type: integer
                note:
                  type: string
                  nullable: true
      responses:
        '204':
          description: updated
    delete:
      responses:
        '204':
          description: deleted
  /items/{id}/tags/{tag}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tag
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
  /forms:
    post:
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [a]
              properties:
                a:
                  type: string
      responses:
        '200':
          description: ok
  /plain:
    post:
      requestBody:
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: ok
          content:
            text/plain:
              schema:
                type: string
  /probe:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                d:
                  type: string
                  format: date
                dt:
                  type: string
                  format: date-time
                u:
                  type: string
                  format: uri
                id:
                  type: string
                  format: uuid
                ip:
                  type: string
                  format: ipv4
                m:
                  type: number
                  multipleOf: 0.5
                big:
                  type: integer
                uniq:
                  type: array
                  uniqueItems: true
                  items:
                    type: integer
                few:
                  type: array
                  minItems: 2
                  items:
                    type: string
                small:
                  type: object
                  minProperties: 1
                  maxProperties: 1
                any:
                  anyOf:
                    - type: string
                      maxLength: 2
                    - type: integer
                all:
                  allOf:
                    - type: string
                      minLength: 2
                    - type: string
                      maxLength: 3
                notstr:
                  not:
                    type: string
                color:
                  type: string
                  enum: [red, green]
                n:
                  type: integer
                  enum: [1, 2]
                maxed:
                  type: number
                  maximum: 10
                  exclusiveMaximum: true
                uni:
                  type: string
                  maxLength: 2
                nested:
                  type: array
                  items:
                    type: object
                    required: [k]
                    properties:
                      k:
                        type: boolean
      responses:
        '200':
          description: ok
  /nobody:
    get:
      responses:
        '202':
          description: accepted
components:
  schemas:
    NewItem:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: number
        qty:
          type: integer
          minimum: 0
        tags:
          type: array
          maxItems: 2
          items:
            type: string
        dims:
          $ref: '#/components/schemas/Dims'
    Dims:
      type: object
      required: [w]
      properties:
        w:
          type: number
        h:
          type: number
