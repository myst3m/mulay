openapi: 3.0.0
info:
  title: Shipping API
  description: 注文の配送を受け付け、到着予定日を返す System API。
  version: "1.0"
paths:
  /shipments:
    post:
      summary: 配送を受け付ける
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentRequest"
      responses:
        "201":
          description: 受け付けた配送
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
              example:
                shipmentId: S-1001
                orderId: a0B5g00000XyZ1
                eta: "2026-10-27"
        "400":
          description: 注文の ID が無い
  /shipments/{id}:
    get:
      summary: 配送の状態を見る
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 配送の状態
          content:
            application/json:
              example:
                shipmentId: S-1001
                status: preparing
components:
  schemas:
    ShipmentRequest:
      type: object
      required: [orderId]
      properties:
        orderId:
          type: string
        customer:
          type: string
    Shipment:
      type: object
      properties:
        shipmentId:
          type: string
        orderId:
          type: string
        eta:
          type: string
