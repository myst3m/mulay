syntax = "proto3";
package cs;

message Req {
  string name = 1;
  int32 count = 2;
}

message Rep {
  string message = 1;
  int32 n = 2;
}

service C {
  rpc Ticks (Req) returns (stream Rep);
  rpc TicksSlow (Req) returns (stream Rep);
  rpc TicksFail (Req) returns (stream Rep);
  rpc TicksDeny (Req) returns (stream Rep);
  rpc Sum (stream Req) returns (Rep);
  rpc SumEarly (stream Req) returns (Rep);
  rpc Chat (stream Req) returns (stream Rep);
  rpc ChatFail (stream Req) returns (stream Rep);
  rpc Hang (Req) returns (stream Rep);
  rpc HangSum (stream Req) returns (Rep);
  rpc Headers (Req) returns (Rep);
}
