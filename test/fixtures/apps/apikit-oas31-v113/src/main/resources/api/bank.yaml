openapi: 3.1.0
info:
  title: Bank API
  version: 1.0.0
servers:
  - url: http://localhost:18587/api/v1
paths:
  /deposits:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/DepositRequest.json"
      responses:
        "201":
          description: ok
  /channels:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  const: Atm
                note:
                  type: [string, "null"]
                count:
                  type: integer
                  minimum: 0
                a:
                  type: [integer, string]
                b:
                  type: [boolean, "null", integer]
                c:
                  type: ["null", string]
              required: [channel]
  /checks:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: {type: integer, maximum: 10, exclusiveMinimum: 0}
                name: {type: string, minLength: 2, maxLength: 4, pattern: "^[a-z]+$"}
                tags: {type: array, items: {type: string}, minItems: 1, maxItems: 2, uniqueItems: true}
                ratio: {type: number, multipleOf: 0.5, exclusiveMaximum: 2}
                mail: {type: string, format: email}
                when: {type: string, format: date}
                pick: {oneOf: [{type: string}, {type: integer}]}
                any: {anyOf: [{type: string, maxLength: 1}, {type: boolean}]}
                all: {allOf: [{type: integer}, {minimum: 5}]}
                nope: {not: {type: string}}
                inner:
                  type: object
                  properties:
                    deep: {type: object, required: [x], properties: {x: {enum: [1, 2]}}}
      responses:
        "201":
          description: ok
  /nums:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                n1: {type: number, minimum: 1}
                n2: {minimum: 1}
                n3: {type: integer, multipleOf: 2}
                n4: {type: [integer, "null"], minimum: 3}
                n5: {type: number, maximum: 1.5}
                n6: {type: integer, minimum: 2.5}
                n7: {type: number, exclusiveMinimum: 0}
      responses:
        "201":
          description: ok
  /items/{code}:
    get:
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string, pattern: "^[A-Z]{2}$"}
        - name: limit
          in: query
          schema: {type: integer, maximum: 50}
        - name: sort
          in: query
          required: true
          schema: {enum: [asc, desc]}
        - name: x-tenant
          in: header
          schema: {type: [string, "null"], minLength: 3}
      responses:
        "200":
          description: ok
