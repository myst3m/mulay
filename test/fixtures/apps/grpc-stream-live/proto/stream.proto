syntax = "proto3";
package st;

message Req {
  string name = 1;
  int32 count = 2;
}

message Rep {
  string message = 1;
  int32 n = 2;
}

service S {
  rpc Ticks (Req) returns (stream Rep);
  rpc TicksLater (Req) returns (stream Rep);
  rpc TicksFail (Req) returns (stream Rep);
  rpc TicksResult (Req) returns (stream Rep);
  rpc Sum (stream Req) returns (Rep);
  rpc SumFail (stream Req) returns (Rep);
  rpc Chat (stream Req) returns (stream Rep);
  rpc Plain (Req) returns (Rep);
}
