syntax = "proto3";

package demo;

message HelloRequest {
  string name = 1;
  int32 count = 2;
  repeated string tags = 3;
}

message HelloReply {
  string message = 1;
  int32 n = 2;
  repeated string tags = 3;
}

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc ListGreetings (HelloRequest) returns (stream HelloReply);
  rpc CollectNames (stream HelloRequest) returns (HelloReply);
  rpc Chat (stream HelloRequest) returns (stream HelloReply);
}

service Lab {
  rpc Echo (HelloRequest) returns (HelloReply);
  rpc Build (HelloRequest) returns (HelloReply);
  rpc BuildJson (HelloRequest) returns (HelloReply);
  rpc Fail (HelloRequest) returns (HelloReply);
  rpc FailStatus (HelloRequest) returns (HelloReply);
  rpc Inspect (HelloRequest) returns (HelloReply);
  rpc NoFlow (HelloRequest) returns (HelloReply);
  rpc Infer (HelloRequest) returns (HelloReply);
}
