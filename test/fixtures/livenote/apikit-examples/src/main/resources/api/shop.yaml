openapi: 3.0.0
info:
  title: shop
  version: "1"
paths:
  /items:
    get:
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            example: 10
        - name: q
          in: query
          example: pen
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              example:
                - id: 1
        "404":
          description: missing
          content:
            application/json:
              examples:
                nf:
                  value:
                    error: missing
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: bad
          content:
            text/plain:
              example: bad request
  /orders:
    post:
      parameters:
        - name: X-Tenant
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [orderId, qty, when]
              properties:
                orderId:
                  type: string
                  format: uuid
                qty:
                  type: integer
                  minimum: 3
                when:
                  type: string
                  format: date-time
                note:
                  type: string
      responses:
        "201":
          description: created
components:
  schemas:
    Item:
      type: object
      example:
        id: 2
        name: ink
