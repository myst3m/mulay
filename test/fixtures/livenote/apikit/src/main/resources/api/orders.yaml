openapi: 3.0.0
info:
  title: orders
  version: "1.0"
paths:
  /orders:
    get:
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: created
  /orders/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: one
          content:
            application/json:
              example:
                item: pen
                qty: 1
        "404":
          description: none
          content:
            application/json:
              examples:
                gone:
                  value: {message: gone}
components:
  schemas:
    Order:
      type: object
      required: [item]
      properties:
        item:
          type: string
        qty:
          type: integer
